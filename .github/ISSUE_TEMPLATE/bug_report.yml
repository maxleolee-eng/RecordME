name: Bug 反馈 / Bug report
description: 报告 RecordME 的可复现问题；请勿填写敏感信息。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "这里的报告和附件完全公开。请勿上传完整录像、凭证或未经清理的日志。安全问题请联系 maxleolee@gmail.com。"
  - type: input
    id: version
    attributes:
      label: RecordME 版本与构建号
      placeholder: "例如：1.4.13（35）"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本与芯片类型
      placeholder: "例如：macOS 14.7，Apple Silicon；无需填写序列号"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最少复现步骤
      description: "说明所选屏幕/摄像头/声音来源、布局和操作，不要填写设备序列号或私人路径。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与发生频率
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充证据（可选）
      description: "仅附已脱敏的截图或最少错误片段。"
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开提交确认
      options:
        - label: "我已检查正文和附件，移除了凭证、私人路径及不应公开的个人信息。"
          required: true
